name: Calendar Bridge Sync

on:
  schedule:
    - cron: "*/15 * * * *"   # runs every 15 minutes
  workflow_dispatch:           # lets you trigger it manually from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r calendar-bridge/requirements.txt

      # Restore cached bridge_data (state.json) from the previous run so the
      # bridge can skip events that haven't changed instead of re-processing
      # everything from scratch each time.
      - name: Restore bridge data cache
        uses: actions/cache@v4
        with:
          path: calendar-bridge/bridge_data
          key: bridge-data-${{ github.run_id }}
          restore-keys: bridge-data-

      - name: Write credential files
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          mkdir -p calendar-bridge/bridge_data
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > calendar-bridge/google_credentials.json
          # Only write the token if the cache didn't already restore a fresh one
          if [ ! -f calendar-bridge/bridge_data/google_token.json ]; then
            printf '%s' "$GOOGLE_TOKEN_JSON" > calendar-bridge/bridge_data/google_token.json
          fi

      - name: Run sync (once)
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          GOOGLE_CREDENTIALS_FILE: google_credentials.json
          TARGET_CALENDAR_NAME: ${{ vars.TARGET_CALENDAR_NAME || 'Outlook (Work)' }}
          DAYS_PAST: ${{ vars.DAYS_PAST || '30' }}
          DAYS_FUTURE: ${{ vars.DAYS_FUTURE || '365' }}
        working-directory: calendar-bridge
        run: python bridge.py --once

      # Persist the (possibly refreshed) Google OAuth token back to GitHub
      # Secrets so the next run doesn't need to re-authenticate.
      - name: Persist refreshed Google token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TOKEN_FILE="calendar-bridge/bridge_data/google_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set GOOGLE_TOKEN_JSON \
              --body "$(cat "$TOKEN_FILE")" \
              --repo "${{ github.repository }}"
          fi
